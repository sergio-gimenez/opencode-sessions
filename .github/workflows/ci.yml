name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  demo-fixture:
    name: Demo fixture builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The recorded demo is only reproducible if the synthetic fixture still
      # builds and the picker can list it end to end.
      # Run the local binary rather than npx: the fixture home has no npm cache.
      - name: Build fixture and list sessions
        run: |
          npm run demo:build
          HOME="$PWD/demo/.fixture/home" OCS_DRY_RUN=1 ./node_modules/.bin/tsx src/cli.ts --print
